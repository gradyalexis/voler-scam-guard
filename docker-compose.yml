services:
  # Postgres lokal, hanya jalan kalau profile `local-db` aktif (set
  # COMPOSE_PROFILES=local-db di .env). Dengan Supabase service ini tidak dibuat.
  postgres:
    image: postgres:16-alpine
    container_name: vsg-postgres
    restart: always
    profiles: [local-db]
    environment:
      POSTGRES_DB: ${DB_NAME:-voler_scam_guard}
      POSTGRES_USER: ${DB_USER:-vsg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    ports:
      # Sengaja diikat ke loopback: cukup untuk psql dan menjalankan bot/dashboard
      # dari luar container saat development, tapi tidak terbuka ke internet.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skrip di sini hanya jalan saat volume pgdata masih kosong.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vsg} -d ${DB_NAME:-voler_scam_guard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vsg]

  bot:
    build: ./bot
    container_name: vsg-bot
    restart: always
    init: true
    env_file: .env
    environment:
      # Supabase: DATABASE_URL dari .env. Postgres lokal: COMPOSE_DATABASE_URL (host `postgres`).
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-${DATABASE_URL:?DATABASE_URL wajib diisi di .env}}
      TESSDATA_PATH: /app/tessdata
    ports:
      # Endpoint health bot: curl http://localhost:9000/health
      # Diikat ke loopback — tidak ada alasan endpoint ini terbuka ke internet.
      # Hapus prefix 127.0.0.1: kalau mau diakses dari mesin lain.
      - "127.0.0.1:9000:9000"
    volumes:
      - tessdata:/app/tessdata
      # CA cert Supabase. DATABASE_SSL_CA_FILE relatif ke root project (= /app di container).
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks: [vsg]

volumes:
  pgdata:
  tessdata:

networks:
  vsg:
    driver: bridge
